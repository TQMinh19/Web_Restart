<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Quản Trị</title>
  <link rel="stylesheet" href="../CSS/dangnhapadmin.css">
</head>
<body>
  <div class="login-container" id="loginPage">
    <div class="login-box">
      <h2>ĐĂNG NHẬP</h2>
      <form id="loginForm" action="#" method="post">
        <div class="input-group">
          <label for="username" class="sr-only">Email của bạn</label>
          <div class="input-field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="icon-svg" role="img" aria-label="email">
                <path fill="currentColor" d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm0 2v.51l9 5.4 9-5.4V7l-9 5.4L3 7Zm18 10V9.81l-8.48 5.08a1 1 0 0 1-1.04 0L3 9.81V17h18Z"/>
              </svg>
            </span>
            <input type="text" id="username" name="adminUser" placeholder="Email của bạn" required>
            <span class="field-required" aria-hidden="true">*</span>
          </div>
        </div>

        <div class="input-group">
          <label for="password" class="sr-only">Nhập mật khẩu</label>
          <div class="input-field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="icon-svg" role="img" aria-label="password">
                <path fill="currentColor" d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V6Zm7 13H7v-9h10v9Zm-5-6a2 2 0 0 0-1 3.73V18h2v-1.27A2 2 0 0 0 12 13Z"/>
              </svg>
            </span>
            <input type="password" id="password" name="adminPass" placeholder="Nhập mật khẩu" required>
            <span class="field-required" aria-hidden="true">*</span>
          </div>
        </div>
        <button type="submit" class="btn-login">Đăng Nhập</button>
      </form>
    </div>
  </div>
  <script src="../JS/static-data.js"></script>
  <script src="../JS/admin-auth.js"></script>
</body>
</html>
