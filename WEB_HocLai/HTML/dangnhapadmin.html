<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Quản Trị</title>
  <link rel="stylesheet" href="../CSS/dangnhapadmin.css">
</head>
<body>
  <div class="login-container" id="loginPage">
    <div class="login-box">
      <h2>ĐĂNG NHẬP</h2>
      <p class="note">Đăng nhập quản trị tĩnh</p>
      <form action="giaodienadmin.html" method="get">
        <div class="input-group">
          <label class="sr-only" for="username">Email quản trị</label>
          <div class="input-field"><span class="field-icon">✉</span><input id="username" name="username" type="email" placeholder="Email quản trị"></div>
        </div>
        <div class="input-group">
          <label class="sr-only" for="password">Mật khẩu</label>
          <div class="input-field"><span class="field-icon">●</span><input id="password" name="password" type="password" placeholder="Mật khẩu"></div>
        </div>
        <button type="submit" class="btn-login">Đăng nhập</button>
      </form>
    </div>
  </div>
</body>
</html>
