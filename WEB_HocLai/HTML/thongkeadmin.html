<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống kê khách hàng</title>
  <link rel="stylesheet" href="../CSS/giaodienadmin.css">
</head>
<body>
  <main class="main" style="max-width:1000px;margin:0 auto;">
    <section class="module-card">
      <div class="admin-meta-header"><h2>Thống kê khách hàng</h2><a href="giaodienadmin.html#orders" class="btn-back-home">Quay lại quản trị</a></div>
      <p class="stats-note">5 khách hàng có tổng tiền mua cao nhất, không tính đơn đã hủy.</p>
      <form id="statsForm" class="orders-filters">
        <div class="orders-filter-item"><label for="statsFrom">Từ ngày</label><input id="statsFrom" type="date"></div>
        <div class="orders-filter-item"><label for="statsTo">Đến ngày</label><input id="statsTo" type="date"></div>
        <button type="submit" class="orders-search-btn">Thống kê</button>
      </form>
      <div id="statsBody" class="stats-static-list" aria-live="polite"></div>
      <section id="order-detail-panel" class="admin-order-detail" hidden><div class="admin-order-detail-header"><h3>Chi tiết đơn hàng</h3><button type="button" data-order-detail-close>Đóng</button></div><div id="orderDetailContent"></div></section>
    </section>
  </main>
  <script src="../JS/static-data.js"></script>
  <script src="../JS/admin.js"></script>
</body>
</html>
