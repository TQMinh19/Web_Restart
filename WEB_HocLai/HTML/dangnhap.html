<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/dangnhap.css?v=20260325-1">
    <title>Đăng nhập</title>
</head>
<body>
    <div class="card">
        <div class="login-container">
            <h1 class="title">Đăng Nhập</h1>
            <p class="error-msg"></p>
            <form id="loginForm" action="#" method="post">
                <input type="hidden" name="next" value="">
                <div class="field">
                    <input type="email" id="email" name="email" placeholder="Email của bạn">
                </div>
                <div class="field">
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu">
                </div>
                <button class="login-btn" type="submit">Đăng Nhập</button>
            </form>
            <div class="social-row">
                <a class="social google" href="https://www.google.com" target="_blank" rel="noopener">
                    <img src="../Image/goo.png" alt="Google">Google
                </a>
                <a class="social facebook" href="https://www.facebook.com" target="_blank" rel="noopener">
                    <img src="../Image/face.jpg" alt="Facebook">Facebook
                </a>
            </div>
            <div class="links">
                <div><a href="quenmatkhau.html">Quên mật khẩu?</a></div>
                <div>Chưa có tài khoản? <a href="dangky.html">Đăng ký</a></div>
            </div>
        </div>
    </div>
    <script src="../JS/static-data.js"></script>
    <script src="../JS/static-auth.js"></script>
</body>
</html>
