<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/dangky.css">
  <title>Đăng ký</title>
</head>
<body>
  <div class="card"><div class="login-container">
    <h1 class="title">Đăng Ký</h1>
    <div class="error-msg"></div>
    <form id="registerForm" action="#" method="post" class="register-form">
      <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="abc@example.com" required><small>Email sẽ được dùng để đăng nhập</small></div>
      <div class="form-group"><label for="password">Mật khẩu</label><input type="password" id="password" name="password" placeholder="Tối thiểu 6 ký tự" required><small>Chọn mật khẩu mạnh cho bảo mật tài khoản</small></div>
      <div class="form-group"><label for="confirmPassword">Xác nhận mật khẩu</label><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" required></div>
      <div class="form-group"><label for="phone">Số điện thoại</label><input type="tel" id="phone" name="phone" placeholder="0123456789" pattern="[0-9]{10,11}" required><small>Số điện thoại để liên hệ</small></div>
      <div class="form-group"><label for="address">Địa chỉ</label><input type="text" id="address" name="address" placeholder="123 Đường ABC, Phường X, Quận Y" required><small>Địa chỉ giao hàng</small></div>
      <button type="submit" class="register-btn">Đăng Ký</button>
    </form>
    <div class="links"><span>Đã có tài khoản? <a href="dangnhap.html">Đăng nhập</a></span></div>
  </div></div>
</body>
</html>
