<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>| 3BK SHOP QUẦN ÁO</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/main.css" />
    <link rel="stylesheet" href="../CSS/pr.css" />
  </head>

  <body>
    <header class="main-header">
      <div class="header-container">
        <div class="header-left">
          <a href="index.html"
            ><img src="../Image/logo.jpg" alt="Logo" class="logo"
          /></a>
        </div>
        <nav class="header-nav">
          <div class="nav-top">
            <ul>
              <li><a href="shop.html">SHOP</a></li>
              <li><a href="shop.html">THE ROLLING STONES</a></li>
              <li><a href="Contacts.html">CONTACT</a></li>
              <li><a href="aboutus.html">ABOUT US</a></li>
            </ul>
          </div>
          <div class="nav-bottom">
            <ul>
              <li class="best-seller"><a href="shop.html">BEST SELLER</a></li>
            </ul>
          </div>
        </nav>
        <div class="header-right">
          <div class="search-box">
            <input type="text" placeholder="Tìm kiếm..." />
            <button><span class="search-icon">🔍</span></button>
          </div>
          <a href="dangnhap.html" class="user-link"
            ><span class="icon user-icon">👤</span></a
          >
          <a href="cart.html" class="cart-link"
            ><span class="icon cart-icon"
              >🛒<span class="cart-count">0</span></span
            ></a
          >
          <span class="lang-select">Vi</span>
          <span class="lang-select">En</span>
        </div>
      </div>
    </header>

    <section class="product-section" data-product-id="">
      <div class="product-container">
        <div class="product-image">
          <img src="" alt="" class="main-image" />
        </div>
        <div class="product-details">
          <h1 class="product-name"></h1>
          <p class="product-price"></p>

          <div class="product-color">
            <p class="color-label"></p>

            <div class="color-options">
              <img src="" alt="" data-color="" class="color-thumbnail" />
            </div>
          </div>

          <div class="product-size">
            <p class="size-label">SIZE</p>
            <div class="size-options">
              <button class="size-btn"></button>
            </div>
          </div>

          <p class="shipping-info"></p>

          <div class="product-info-links">
            <details class="details-dropdown">
              <summary class="details-summary">PRODUCT DETAILS ↓</summary>
              <div class="details-content">
                <ul>
                  <li></li>
                </ul>
              </div>
            </details>

            <details class="details-dropdown">
              <summary class="details-summary">SIZE GUIDE ↓</summary>
              <div class="details-content">
                <table class="size-guide-table">
                  <thead>
                    <tr>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td></td>
                    </tr>
                  </tbody>
                </table>

                <ul>
                  <li></li>
                </ul>

                <p></p>
              </div>
            </details>

            <a href="Contacts.html" class="info-link">SHIPPING & RETURNS ></a>
          </div>

          <p class="chat-link"><a href="Contacts.html">CHAT WITH US</a></p>

          <a href="cart.html" style="text-decoration: none"
            ><button class="add-to-bag-btn">ADD TO BAG</button></a
          >
        </div>
      </div>
    </section>

    <script>
      window.currentProductId = Number(
        new URLSearchParams(window.location.search).get("id") || 0,
      );

      document.addEventListener("DOMContentLoaded", function () {
        const mainImage = document.querySelector(".main-image");
        const colorLabel = document.querySelector(".color-label");
        const colorThumbs = document.querySelectorAll(
          ".color-options .color-thumbnail",
        );

        if (!colorThumbs.length) return;

        colorThumbs.forEach(function (thumb) {
          thumb.addEventListener("click", function (e) {
            e.preventDefault();

            colorThumbs.forEach(function (item) {
              item.classList.remove("active");
            });

            thumb.classList.add("active");

            const src = thumb.getAttribute("src");
            if (mainImage && src) {
              mainImage.setAttribute("src", src);
            }

            const color = (
              thumb.dataset.color ||
              thumb.getAttribute("alt") ||
              ""
            ).toUpperCase();
            if (colorLabel && color) {
              colorLabel.textContent = color;
            }
          });
        });
      });
    </script>
    <script src="../JS/static-data.js"></script>
    <script src="../JS/product-detail.js"></script>
    <script src="../JS/main.js?v=20260328-2"></script>
  </body>
</html>
