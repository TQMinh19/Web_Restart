<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3BK SHOP QUẦN ÁO</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/main.css" />
    <link rel="stylesheet" href="../CSS/storefront.css?v=20261112-shop-font">
</head>

  <body>
    <header class="store-header">
  <div class="store-header-inner">
    <a class="store-logo" href="index.html" aria-label="3BK Shop - Trang chủ"><img src="../Image/logo.jpg" alt="3BK Shop"></a>
    <nav class="store-nav" aria-label="Điều hướng chính">
      <div class="store-nav-top">
        <div class="store-menu store-shop-menu"><a class="store-shop-link" href="shop.html">SHOP</a><div class="store-dropdown"><a href="shop.html">Tất cả sản phẩm</a><a href="shop.html?category=tops&amp;page=1">Áo thun</a><a href="shop.html?category=jacket&amp;page=1">Áo khoác</a><a href="shop.html?category=bottoms&amp;page=1">Quần</a><a href="shop.html?category=accessories&amp;page=1">Phụ kiện</a><a href="shop.html?category=cap&amp;page=1">Mũ</a></div></div>
        <a href="shop.html">THE ROLLING STONES</a><a href="Contacts.html">CONTACT</a><a href="aboutus.html">ABOUT US</a>
      </div>
      <a class="store-best" href="shop.html">BEST SELLER</a>
    </nav>
    <div class="store-tools">
      <form class="store-search" action="timkiem.html" method="get" role="search"><input type="search" name="q" placeholder="Tìm kiếm..." aria-label="Tên sản phẩm"><button type="submit" aria-label="Tìm kiếm">⌕</button></form>
      <details class="store-menu store-account"><summary aria-label="Tài khoản">👤</summary><div class="store-dropdown"><a href="dangnhap.html">Đăng nhập</a><a href="dangky.html">Đăng ký</a></div></details>
      <a class="store-cart" href="cart.html" aria-label="Giỏ hàng">🛒</a><span class="store-lang">Vi</span><span class="store-lang">En</span>
    </div>
  </div>
</header>
<div class="slideshow">
        <img
          src="../Image/stussy_logo.jpg"
          class="slide active"
          alt="Banner 1"
        />
        <img src="../Image/stussy.jpg" class="slide" alt="Banner 2" />
        <!-- <img src="../Image/logo.jpg" class="slide" alt="Banner 3"> -->
      </div>

    <section class="hot-deal">
      <h2>HOT DEAL & SALE</h2>
      <div class="divider">
        <span>///</span>
      </div>
      <p><strong>Kết Thúc Trong:</strong></p>
      <div class="countdown">
        <div id="hours">00</div>
        <div id="minutes">00</div>
        <div id="seconds">00</div>
      </div>
    </section>

    <!-- Login Checkbox Toggle -->
    <input type="checkbox" id="loginToggle" class="login-toggle" />

    <!-- Login Modal -->
    <div class="login-modal">
      <div class="card">
        <label for="loginToggle" class="close-btn">&times;</label>
        <h1 class="title">Đăng nhập</h1>
        <form id="loginForm" action="dadangnhap/thongtinkhachhang.html" method="get" novalidate>
          <div class="field">
            <input
              type="email"
              id="email"
             
              placeholder="Email"
            />
          </div>
          <div class="field">
            <input
              type="password"
              id="password"
             
              placeholder="Mật Khẩu"
            />
          </div>
          <button class="btn login-btn" type="submit">Đăng nhập</button>
        </form>
        <div class="social-row">
          <a class="social google" href="https://www.google.com" target="_blank" rel="noopener">
            <img src="../Image/goo.png" alt="Google" />
            Google
          </a>
          <a class="social facebook" href="https://www.facebook.com" target="_blank" rel="noopener">
            <img src="../Image/face.jpg" alt="Facebook" />
            Facebook
          </a>
        </div>
        <div class="links">
          <div><a href="quenmatkhau.html">Quên mật khẩu</a></div>
          <div>hoặc <a href="dangky.html">Đăng ký</a></div>
        </div>
      </div>
    </div>

    <script src="../JS/main.js"></script>
  </body>
</html>
